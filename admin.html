<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Administration – Big Yakfa Business</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="wrap">

  <!-- Connexion -->
  <section id="login" hidden>
    <img class="logo" src="logo.svg" alt="" width="72" height="72">
    <h1>Espace administrateur</h1>
    <p class="hint">Réservé au propriétaire de la boutique.</p>
    <form id="loginForm" class="stack" autocomplete="on">
      <label class="field"><span>E-mail</span><input id="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Mot de passe</span><input id="password" type="password" autocomplete="current-password" required></label>
      <p class="msg" id="loginMsg" role="alert" hidden></p>
      <button class="btn" type="submit" id="loginBtn">Se connecter</button>
    </form>
    <p class="hint"><a href="index.html">← Retour à la boutique</a></p>
  </section>

  <!-- Tableau de bord -->
  <section id="panel" hidden>
    <header class="adm-top">
      <h1>Administration</h1>
      <div class="adm-actions">
        <a class="btn ghost small" href="index.html" target="_blank" rel="noopener">Voir la boutique</a>
        <button class="btn ghost small" id="btnSettings" type="button">Réglages</button>
        <button class="btn ghost small" id="btnLogout" type="button">Déconnexion</button>
      </div>
    </header>
    <button class="btn wide" id="btnAdd" type="button">+ Ajouter un produit</button>
    <p class="count" id="admCount" aria-live="polite"></p>
    <p class="msg" id="panelMsg" role="alert" hidden></p>
    <ul class="plist" id="plist"></ul>
  </section>

  <p class="fail" id="boot">Chargement…</p>
</div>

<!-- Fiche produit -->
<dialog id="productDlg">
  <form id="productForm" class="stack" method="dialog">
    <h2 id="productTitle">Produit</h2>
    <div class="photo-row">
      <div class="photo-prev" id="photoPrev" aria-hidden="true"></div>
      <div class="stack tight">
        <label class="btn ghost small" for="photoInput">Choisir une photo</label>
        <input id="photoInput" type="file" accept="image/*" class="sr">
        <button class="btn ghost small" id="photoClear" type="button" hidden>Retirer la photo</button>
      </div>
    </div>
    <label class="field"><span>Nom du produit</span><input id="pName" required maxlength="120"></label>
    <label class="field"><span>Catégorie</span><input id="pCat" list="catList" maxlength="60" placeholder="Ex. Mode, Beauté…"></label>
    <datalist id="catList"></datalist>
    <div class="two">
      <label class="field"><span>Prix (<b class="cur"></b>)</span><input id="pPrice" type="number" inputmode="decimal" min="0" step="0.01" required></label>
      <label class="field"><span>Stock</span><input id="pStock" type="number" inputmode="numeric" min="0" step="1" required></label>
    </div>
    <label class="field"><span>Description</span><textarea id="pDesc" maxlength="500"></textarea></label>
    <p class="msg" id="productMsg" role="alert" hidden></p>
    <div class="row-btns">
      <button class="btn" type="submit" id="productSave">Enregistrer</button>
      <button class="btn ghost" type="button" id="productCancel">Annuler</button>
    </div>
    <button class="btn danger small" type="button" id="productDelete" hidden>Supprimer ce produit</button>
  </form>
</dialog>

<!-- Réglages -->
<dialog id="settingsDlg">
  <form id="settingsForm" class="stack" method="dialog">
    <h2>Réglages de la boutique</h2>
    <label class="field"><span>Nom de la boutique</span><input id="sName" required maxlength="80"></label>
    <label class="field"><span>Numéro WhatsApp Business</span><input id="sWa" inputmode="tel" placeholder="243812345678" maxlength="20"></label>
    <p class="hint">Avec l'indicatif du pays, sans le + ni le 0 initial. Exemple RDC : 243812345678.</p>
    <label class="field"><span>Devise affichée</span><input id="sCur" maxlength="8" placeholder="$"></label>
    <label class="field"><span>Titre de bienvenue</span><input id="sWTitle" maxlength="120"></label>
    <label class="field"><span>Message de bienvenue</span><textarea id="sWelcome" maxlength="400"></textarea></label>
    <label class="field"><span>Horaires de réponse</span><input id="sHours" maxlength="160"></label>

    <h3>Club Yakfa</h3>
    <label class="field"><span>Titre</span><input id="cTitle" maxlength="80"></label>
    <label class="field"><span>Texte</span><textarea id="cText" maxlength="300"></textarea></label>
    <label class="field"><span>Avantages (un par ligne)</span><textarea id="cPerks" maxlength="600"></textarea></label>
    <label class="field"><span>Texte du bouton</span><input id="cBtn" maxlength="80"></label>
    <label class="field"><span>Message WhatsApp envoyé</span><input id="cMsg" maxlength="200"></label>

    <h3>Services</h3>
    <div id="svcEdit" class="stack"></div>
    <button class="btn ghost small" type="button" id="svcAdd">+ Ajouter un service</button>

    <p class="msg" id="settingsMsg" role="alert" hidden></p>
    <div class="row-btns">
      <button class="btn" type="submit" id="settingsSave">Enregistrer</button>
      <button class="btn ghost" type="button" id="settingsCancel">Annuler</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
